plugins {
    id 'java'
    id 'application'
}

group   = 'com.fgd'
version = '2.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.fgd.FalseGreenDetector'
}

repositories {
    mavenCentral()
}

dependencies {
    // No runtime dependencies — FGD ships as a standalone fat JAR.
    // Only the JDK standard library (xml, regex, nio) is used.
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.fgd.FalseGreenDetector'
    }
}

// Fat JAR task — single deployable artifact for CI containers.
tasks.register('fatJar', Jar) {
    group       = 'build'
    description = 'Assemble a standalone executable JAR with no external dependencies.'
    archiveBaseName = 'fgd'
    archiveVersion  = version
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.fgd.FalseGreenDetector'
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
